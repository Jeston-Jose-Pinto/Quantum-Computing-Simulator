<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for toast notifications and body font */
        body {
            font-family: 'Inter', sans-serif;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-success {
            background-color: #28a745; /* Green */
        }

        .toast-error {
            background-color: #dc3545; /* Red */
        }
        
        /* Simple animation for the logo */
        @keyframes rotate-sphere {
            from { transform: rotate3d(1, 1, 1, 0deg); }
            to { transform: rotate3d(1, 1, 1, 360deg); }
        }
        .animate-sphere {
            animation: rotate-sphere 12s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-900">

    <div class="relative min-h-screen w-full overflow-hidden bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900">
        <!-- Background elements -->
        <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900"></div>
        <div class="absolute top-0 right-0 w-2/3 h-screen bg-purple-600 opacity-10 blur-3xl rounded-full -mr-32"></div>

        <!-- QSIM Logo -->
        <a href="index.html" id="home-link" class="absolute top-6 left-6 flex items-center space-x-2">
            <div class="relative w-12 h-12 animate-sphere">
                <!-- Gradient Sphere -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-br from-cyan-400 via-purple-500 to-blue-600 shadow-[0_0_20px_rgba(96,165,250,0.5)]"></div>
                <!-- SIM text -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-white font-bold text-lg">SIM</span>
                </div>
            </div>
        </a>

        <!-- Login Card -->
        <div class="relative z-10 flex items-center justify-center min-h-screen px-4">
            <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-2xl p-8">
                <!-- Header -->
                <h2 class="text-3xl sm:text-4xl font-bold mb-6 text-center bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                    Welcome Back
                </h2>

                <form id="login-form" class="space-y-4">
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-200 mb-1">Email</label>
                        <input id="email" type="email" name="email" required class="w-full px-4 py-2 bg-white/20 text-white placeholder-gray-300 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input id="password" type="password" name="password" required placeholder="Enter your password" class="w-full px-4 py-3 bg-white/10 text-white placeholder-gray-400 border border-white/10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full px-6 py-3 text-lg font-medium text-white bg-gradient-to-r from-cyan-500 to-blue-600 rounded-full hover:from-cyan-600 hover:to-blue-700 transition-all duration-300 shadow-lg hover:shadow-cyan-500/30">
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Link -->
                <p class="text-center text-sm text-gray-300 mt-4">
                    Don't have an account?
                    <a href="signup.html" id="signup-link" class="text-blue-400 hover:text-blue-300 transition-colors">Create Account</a>
                </p>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/10"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-gray-800 text-gray-400">OR</span>
                    </div>
                </div>

                <!-- Google Sign In -->
                <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white/10 hover:bg-white/20 text-white border border-white/10 py-3 rounded-lg transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/10">
                    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" 
                         onerror="this.onerror=null; this.src='https://placehold.co/20x20/ffffff/000000?text=G'"
                         alt="Google Logo" class="w-5 h-5" />
                    <span class="text-sm font-medium">Continue with Google</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Load Firebase Config First -->
    <script src="js/firebase-config.js"></script>

    <!-- Main Application Logic -->
    <script type="module">
        // Import Firebase functions from CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithEmailAndPassword,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- 1. Initialize Firebase ---
        // The 'firebaseConfig' variable is now available globally from 'js/firebase-config.js'
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // --- 2. DOM Element References ---
        const loginForm = document.getElementById('login-form');
        const googleSigninBtn = document.getElementById('google-signin-btn');
        document.getElementById('home-link').href = 'index.html';
        document.getElementById('signup-link').href = 'signup.html';

        // --- 3. Toast Notification Logic ---
        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.add('show'); }, 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { container.removeChild(toast); }, 300);
            }, 3000);
        };

        // --- 4. Navigation Logic ---
        const navigate = (path) => {
            window.location.href = path;
        };

        // --- 5. Email/Password Login Logic ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginForm.email.value;
            const password = loginForm.password.value;

            try {
                const userCredentials = await signInWithEmailAndPassword(auth, email, password);
                const loggedUser = userCredentials.user;  
                localStorage.setItem("userId", loggedUser.uid);
                
                showToast("Logged In Successfully", "success");
                navigate("index.html");

            } catch (error) {
                console.error("Login Error:", error);
                showToast("Incorrect email or password", "error");
            }
        });

        // --- 6. Google Sign-In Logic ---
        googleSigninBtn.addEventListener('click', async () => {
            
            googleProvider.setCustomParameters({
                prompt: "select_account",
            });

            try {
                const res=await signInWithPopup(auth, googleProvider);
                localStorage.setItem("userId", res.uid);
                
                showToast("Signed In With Google", "success");
                navigate("index.html");

            } catch (error) {
                console.error("Google Sign-In Error:", error);
                showToast(error.message || "Google Sign-In Failed", "error");
            }
        });

    </script>
</body>
</html>
